<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>أونو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0c1210;
  --bg-1:#0f1b16;
  --felt:#155a3d;
  --felt-2:#0e3f2a;
  --felt-edge:#0a2a1c;
  --gold:#d9b25a;
  --gold-soft:#e9cd8c;
  --cream:#f3ecd8;
  --ink:#12160f;
  --muted:#9db3a7;
  --red:#e1402a;
  --yellow:#f0ae1c;
  --green:#2e9e52;
  --blue:#1e63d8;
  --panel:#0e1613ee;
  --danger:#e1402a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(1200px 700px at 50% -10%, #1a2b23 0%, var(--bg-0) 60%);
  color:var(--cream);
  min-height:100vh;
  overflow-x:hidden;
}
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
button{font-family:inherit;}
#app{min-height:100vh; display:flex; flex-direction:column; align-items:center;}

/* ---------- Top bar ---------- */
.topbar{
  width:100%; max-width:1100px; display:flex; justify-content:space-between;
  align-items:center; padding:14px 18px; gap:10px;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:900; font-size:22px; letter-spacing:.5px;}
.brand .dot{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--red),var(--yellow),var(--green),var(--blue),var(--red));box-shadow:0 0 12px var(--gold);}
.iconbtns{display:flex; gap:8px;}
.iconbtn{
  background:#0f1d17; border:1px solid #24382d; color:var(--cream);
  width:40px; height:40px; border-radius:12px; cursor:pointer; font-size:18px;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.iconbtn[aria-pressed="true"]{ background:var(--gold); color:var(--ink); border-color:var(--gold);}
.iconbtn:hover{transform:translateY(-1px);}
.iconbtn:focus-visible, button:focus-visible, input:focus-visible{outline:3px solid var(--gold-soft); outline-offset:2px;}

/* ---------- Menu ---------- */
.menu{width:100%; max-width:560px; padding:10px 20px 60px; display:flex; flex-direction:column; gap:18px; margin-top:10px;}
.hero{text-align:center; margin-bottom:6px;}
.hero h1{
  font-size:52px; margin:0; font-weight:900;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 2px 0 rgba(0,0,0,.3);
}
.hero p{color:var(--muted); margin:6px 0 0; font-size:15px;}
.card-fan{display:flex; justify-content:center; margin:10px 0 4px;}
.mini-card{width:36px;height:52px;border-radius:8px;margin:0 -10px;border:2px solid var(--cream);box-shadow:0 4px 10px rgba(0,0,0,.4); transform:rotate(var(--r)); display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;}
.panel{
  background:var(--panel); border:1px solid #23362c; border-radius:20px;
  padding:20px; backdrop-filter:blur(6px);
}
.panel h2{margin:0 0 4px; font-size:18px; display:flex; align-items:center; gap:8px;}
.panel .sub{color:var(--muted); font-size:13px; margin:0 0 14px;}
label.field{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
input.text{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid #2a3f33;
  background:#0c1512; color:var(--cream); font-size:16px; font-family:inherit;
}
.opp-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0 16px;}
.opp-opt{
  padding:12px 6px; text-align:center; border-radius:14px; border:1.5px solid #2a3f33;
  background:#0c1512; cursor:pointer; font-weight:700; color:var(--muted);
}
.opp-opt[aria-pressed="true"]{border-color:var(--gold); color:var(--ink); background:var(--gold-soft);}
.btn{
  width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
  font-weight:800; font-size:16px; transition:.15s;
}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:var(--ink);}
.btn-outline{background:transparent; border:1.5px solid var(--gold); color:var(--gold-soft);}
.btn-ghost{background:#0c1512; border:1px solid #2a3f33; color:var(--cream);}
.row{display:flex; gap:10px;}
.row>*{flex:1;}
.divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:4px 0;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#22352a;}

/* ---------- Lobby ---------- */
.lobby-code{
  font-size:40px; font-weight:900; letter-spacing:10px; text-align:center;
  background:#0c1512; border:2px dashed var(--gold); border-radius:16px; padding:16px;
  color:var(--gold-soft);
}
.players-list{list-style:none; padding:0; margin:14px 0; display:flex; flex-direction:column; gap:8px;}
.players-list li{
  display:flex; align-items:center; gap:10px; background:#0c1512; border:1px solid #23362c;
  padding:10px 12px; border-radius:12px; font-weight:700;
}
.players-list li .badge{margin-inline-start:auto; font-size:11px; color:var(--muted); font-weight:600;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--felt-2);display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--gold);}

/* ---------- Game table ---------- */
.table-wrap{width:100%; max-width:1100px; padding:6px 14px 20px; flex:1; display:flex; flex-direction:column;}
.table-felt{
  position:relative; border-radius:34px; padding:18px;
  background:
    radial-gradient(120% 100% at 50% 0%, var(--felt) 0%, var(--felt-2) 70%, var(--felt-edge) 100%);
  border:10px solid #0a1913;
  box-shadow:inset 0 0 60px rgba(0,0,0,.5), 0 20px 40px rgba(0,0,0,.5);
  min-height:70vh; display:flex; flex-direction:column; justify-content:space-between;
}
.opponents{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; padding:6px 0 10px;}
.opp{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 14px;
  border-radius:16px; background:rgba(0,0,0,.25); min-width:100px; transition:.2s;
}
.opp.active{box-shadow:0 0 0 2px var(--gold), 0 0 20px rgba(217,178,90,.5); background:rgba(0,0,0,.4);}
.opp .name{font-weight:800; font-size:13px;}
.opp .count{display:flex; gap:2px;}
.opp .backcard{width:16px;height:24px;border-radius:3px;background:linear-gradient(160deg,var(--red),var(--blue));border:1px solid var(--cream);}
.opp .status{font-size:11px; color:var(--gold-soft); min-height:14px;}

.center-area{display:flex; align-items:center; justify-content:center; gap:26px; padding:14px 0; flex-wrap:wrap;}
.pile{display:flex; flex-direction:column; align-items:center; gap:8px;}
.pile-label{font-size:12px; color:var(--muted); font-weight:700;}
.draw-pile{
  width:80px; height:112px; border-radius:12px; cursor:pointer; border:3px solid var(--cream);
  background:repeating-linear-gradient(135deg,var(--ink) 0 8px, #1b2119 8px 16px);
  display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--gold-soft);
  box-shadow:0 8px 16px rgba(0,0,0,.4); position:relative;
}
.draw-pile:disabled{opacity:.5; cursor:not-allowed;}
.discard-slot{width:80px; height:112px; position:relative;}
.uno-card{
  width:80px; height:112px; border-radius:12px; border:3px solid #fff; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:30px; color:#fff;
  box-shadow:0 8px 18px rgba(0,0,0,.45);
}
.uno-card.small{width:58px; height:84px; font-size:20px; border-radius:9px; border-width:2.5px;}
.uno-card .corner{position:absolute; top:4px; inset-inline-start:6px; font-size:12px; font-weight:900;}
.uno-card.small .corner{font-size:9px; top:3px;}
.c-red{background:linear-gradient(160deg,#f0553d,var(--red));}
.c-yellow{background:linear-gradient(160deg,#ffcf4d,var(--yellow)); color:#3a2a00;}
.c-green{background:linear-gradient(160deg,#4cc27a,var(--green));}
.c-blue{background:linear-gradient(160deg,#4d84ec,var(--blue));}
.c-wild{background:conic-gradient(var(--red),var(--yellow),var(--green),var(--blue));}
.wild-color-dot{position:absolute; bottom:6px; inset-inline-end:6px; width:14px;height:14px;border-radius:50%;border:1px solid #fff;}

.hand-wrap{display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 0 4px;}
.hand-info{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--gold-soft); font-weight:800; min-height:20px;}
.hand{
  display:flex; justify-content:center; gap:-6px; padding:6px 8px 2px; overflow-x:auto; width:100%;
  scrollbar-width:thin;
}
.hand-card{
  width:72px; height:104px; border-radius:11px; border:3px solid #fff; margin-inline-start:-16px;
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:26px; color:#fff;
  cursor:pointer; transition:.15s; flex:none; position:relative; box-shadow:0 6px 14px rgba(0,0,0,.4);
}
.hand-card:first-child{margin-inline-start:0;}
.hand-card:hover, .hand-card:focus-visible{transform:translateY(-14px); z-index:2;}
.hand-card:disabled{filter:grayscale(.6) brightness(.7); cursor:not-allowed;}
.hand-card:disabled:hover{transform:none;}

.turn-banner{
  text-align:center; padding:8px; font-weight:800; font-size:14px; color:var(--gold-soft);
  min-height:20px;
}

/* color picker modal */
.overlay{
  position:fixed; inset:0; background:rgba(6,10,8,.72); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.modal{
  background:#0e1613; border:1px solid #2a3f33; border-radius:22px; padding:26px; max-width:360px; width:100%;
  text-align:center;
}
.modal h3{margin:0 0 16px; font-size:19px;}
.color-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
.color-btn{height:64px; border-radius:14px; border:2px solid #fff; cursor:pointer; font-weight:800; color:#fff;}
.win-emoji{font-size:52px; margin-bottom:8px;}

/* live region */
#live{position:fixed; bottom:0; inset-inline-start:0;}

.footer-note{color:var(--muted); font-size:12px; text-align:center; padding:10px; max-width:520px;}

@media (max-width:520px){
  .hero h1{font-size:38px;}
  .draw-pile,.uno-card{width:66px; height:94px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   أونو — محرك اللعبة الكامل
   ========================================================= */

const COLORS = ['red','yellow','green','blue'];
const COLOR_NAMES = {red:'أحمر', yellow:'أصفر', green:'أخضر', blue:'أزرق'};
const SYMBOLS = {skip:'⛔', reverse:'🔁', draw2:'+2', wild:'★', wild4:'+4'};
const AI_NAME_POOL = ['عمر','آسيا','خيال','جوري','لين','ياسمين','سلطان','نوف','فراس','ريما','عبدالله','دانة','سامي','لمى','طلال','هيا'];
function pickAINames(count){
  const pool = shuffle(AI_NAME_POOL.slice());
  return pool.slice(0, count);
}

let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } return audioCtx; }

/* ---------- persistent-ish app state ---------- */
const State = {
  screen:'menu',           // menu | lobby | game
  soundOn:true,
  narrateOn:false,
  playerName:'أنت',
  mode:null,               // 'ai' | 'room'
  aiCount:1,
  game:null,               // local game object
  room:null,               // {code, myId, isHost, players[]}
  roomPoll:null,
};

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    const v = attrs[k];
    if(v===undefined || v===null) continue;
    if(k==='html'){ e.innerHTML = v; }
    else if(k.startsWith('on')){ e.addEventListener(k.slice(2), v); }
    else if(k==='class'){ e.className = v; }
    else e.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function announce(text, {force=false}={}){
  const live = document.getElementById('live');
  live.textContent = '';
  requestAnimationFrame(()=>{ live.textContent = text; });
  if((State.narrateOn||force) && 'speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-SA'; u.rate = 1.02;
    window.speechSynthesis.speak(u);
  }
}

/* ---------- sound effects (synth, no files) ---------- */
function tone(freq, dur, {type='sine', vol=0.18, delay=0}={}){
  if(!State.soundOn) return;
  try{
    const ctx = ensureAudio();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
const SFX = {
  play(){ tone(520,.12); tone(700,.12,{delay:.05}); },
  draw(){ tone(220,.18,{type:'triangle'}); },
  invalid(){ tone(140,.18,{type:'sawtooth', vol:.14}); },
  uno(){ tone(600,.14); tone(900,.18,{delay:.1}); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.22,{delay:i*.12})); },
  click(){ tone(380,.06,{vol:.12}); },
};

/* ---------- deck ---------- */
function buildDeck(){
  const deck = [];
  let id = 0;
  COLORS.forEach(color=>{
    deck.push({id:id++, color, type:'number', value:0});
    for(let v=1; v<=9; v++){ deck.push({id:id++, color, type:'number', value:v}); deck.push({id:id++, color, type:'number', value:v}); }
    ['skip','reverse','draw2'].forEach(type=>{
      deck.push({id:id++, color, type}); deck.push({id:id++, color, type});
    });
  });
  for(let i=0;i<4;i++) deck.push({id:id++, color:null, type:'wild'});
  for(let i=0;i<4;i++) deck.push({id:id++, color:null, type:'wild4'});
  return deck;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function cardLabel(card){
  if(card.type==='number') return String(card.value);
  return SYMBOLS[card.type];
}
function cardColorClass(card, chosenColor){
  const c = card.color || chosenColor;
  return c ? ('c-'+c) : 'c-wild';
}
function renderCard(card, {small=false, chosenColor=null, disabled=false, onClick=null, aria=''}={}){
  const cls = 'uno-card' + (small?' small':'') + ' ' + cardColorClass(card, chosenColor);
  const btn = onClick ? el('button', {
      class:'hand-card '+cardColorClass(card, chosenColor),
      disabled: disabled?true:undefined,
      'aria-label': aria || describeCard(card),
      onclick:onClick
    }, [cardLabel(card)])
    : el('div', {class:cls, 'aria-hidden':'true'}, [
        el('span',{class:'corner'},[cardLabel(card)]),
        cardLabel(card),
        (card.type==='wild'||card.type==='wild4') && chosenColor ? el('span',{class:'wild-color-dot', style:`background:var(--${chosenColor})`}) : null
      ]);
  return btn;
}
function describeCard(card){
  const color = card.color ? COLOR_NAMES[card.color] : 'متعددة الألوان';
  if(card.type==='number') return `${color} رقم ${card.value}`;
  if(card.type==='skip') return `${color} حجب الدور`;
  if(card.type==='reverse') return `${color} عكس الاتجاه`;
  if(card.type==='draw2') return `${color} اسحب بطاقتين`;
  if(card.type==='wild') return 'بطاقة تغيير اللون';
  if(card.type==='wild4') return 'بطاقة اسحب أربعة وتغيير اللون';
  return color;
}

/* ---------- local (vs AI) game engine ---------- */
function newLocalGame(aiCount, playerName){
  const n = aiCount+1;
  const deck = shuffle(buildDeck());
  const players = [];
  players.push({id:'p0', name:playerName||'أنت', isAI:false, hand:[]});
  const aiNames = pickAINames(aiCount);
  for(let i=1;i<=aiCount;i++) players.push({id:'ai'+i, name:aiNames[i-1]||('لاعب افتراضي '+i), isAI:true, hand:[]});
  for(let r=0;r<7;r++) players.forEach(p=>p.hand.push(deck.pop()));
  let top = deck.pop();
  while(top.type==='wild4'){ deck.unshift(top); top = deck.pop(); }
  const chosenColor = top.color || COLORS[Math.floor(Math.random()*4)];
  return {
    players, deck, discard:[top], currentIndex:0, direction:1,
    chosenColor, winner:null, log:[], pendingUnoWarn:null,
  };
}
function topCard(g){ return g.discard[g.discard.length-1]; }
function playerCount(g){ return g.players.length; }
function nextIndex(g, from, step=1){
  const n = playerCount(g);
  return ((from + g.direction*step) % n + n) % n;
}
function canPlay(g, card){
  const top = topCard(g);
  const activeColor = g.chosenColor;
  if(card.type==='wild'||card.type==='wild4') return true;
  if(card.color===activeColor) return true;
  if(top.type==='number' && card.type==='number' && card.value===top.value) return true;
  if(top.type!=='number' && card.type===top.type) return true;
  return false;
}
function drawFromDeck(g, count=1){
  const drawn = [];
  for(let i=0;i<count;i++){
    if(g.deck.length===0){
      const top = g.discard.pop();
      g.deck = shuffle(g.discard);
      g.discard = [top];
    }
    if(g.deck.length===0) break;
    drawn.push(g.deck.pop());
  }
  return drawn;
}

function applyPlay(g, playerIdx, card, chosenColor){
  const p = g.players[playerIdx];
  p.hand = p.hand.filter(c=>c.id!==card.id);
  g.discard.push(card);
  g.chosenColor = card.color || chosenColor || COLORS[0];

  if(p.hand.length===0){ g.winner = p; return; }

  let advance = 1;
  if(card.type==='skip'){ advance = 2; }
  else if(card.type==='reverse'){
    g.direction *= -1;
    if(playerCount(g)===2) advance = 2;
  } else if(card.type==='draw2'){
    const victimIdx = nextIndex(g, playerIdx, 1);
    g.players[victimIdx].hand.push(...drawFromDeck(g,2));
    advance = 2;
  } else if(card.type==='wild4'){
    const victimIdx = nextIndex(g, playerIdx, 1);
    g.players[victimIdx].hand.push(...drawFromDeck(g,4));
    advance = 2;
  }
  g.currentIndex = nextIndex(g, playerIdx, advance);
}

function aiChoosePlay(g, playerIdx){
  const p = g.players[playerIdx];
  const playable = p.hand.filter(c=>canPlay(g,c));
  if(playable.length===0) return null;
  const nonWild = playable.filter(c=>c.type!=='wild'&&c.type!=='wild4');
  const chosen = (nonWild.length? nonWild : playable)
    .sort((a,b)=> (a.type==='number'?0:1) - (b.type==='number'?0:1))[0]
    || playable[Math.floor(Math.random()*playable.length)];
  let color = null;
  if(chosen.type==='wild'||chosen.type==='wild4'){
    const counts = {red:0,yellow:0,green:0,blue:0};
    p.hand.forEach(c=>{ if(c.color) counts[c.color]++; });
    color = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  }
  return {card:chosen, color};
}

/* ---------- room (multiplayer) via shared storage ---------- */
function randCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function roomKey(code){ return 'uno-room:'+code; }
function myLocalId(){
  let id = sessionStorage.getItem('uno-my-id');
  if(!id){ id = 'u'+Math.random().toString(36).slice(2,9); sessionStorage.setItem('uno-my-id', id); }
  return id;
}
async function roomGet(code){
  try{ const r = await window.storage.get(roomKey(code), true); return r? JSON.parse(r.value): null; }
  catch(e){ return null; }
}
async function roomSet(code, obj){
  obj.updatedAt = Date.now();
  await window.storage.set(roomKey(code), JSON.stringify(obj), true);
}

async function createRoom(name){
  const code = randCode();
  const myId = myLocalId();
  const room = { code, hostId:myId, players:[{id:myId, name}], started:false, state:null };
  await roomSet(code, room);
  State.room = { code, myId, isHost:true };
  return code;
}
async function joinRoom(code, name){
  const room = await roomGet(code);
  if(!room) return {ok:false, reason:'not_found'};
  if(room.started) return {ok:false, reason:'started'};
  const myId = myLocalId();
  if(!room.players.find(p=>p.id===myId)){
    if(room.players.length>=4) return {ok:false, reason:'full'};
    room.players.push({id:myId, name});
    await roomSet(code, room);
  }
  State.room = { code, myId, isHost: room.hostId===myId };
  return {ok:true};
}
function initGameStateForRoom(players){
  const n = players.length;
  const deck = shuffle(buildDeck());
  const gp = players.map(p=>({id:p.id, name:p.name, isAI:false, hand:[]}));
  for(let r=0;r<7;r++) gp.forEach(p=>p.hand.push(deck.pop()));
  let top = deck.pop();
  while(top.type==='wild4'){ deck.unshift(top); top = deck.pop(); }
  const chosenColor = top.color || COLORS[Math.floor(Math.random()*4)];
  return { players:gp, deck, discard:[top], currentIndex:0, direction:1, chosenColor, winner:null };
}

/* =========================================================
   RENDERING
   ========================================================= */
function root(){ return document.getElementById('app'); }
function draw(){
  root().innerHTML='';
  root().appendChild(topBar());
  if(State.screen==='menu') root().appendChild(renderMenu());
  else if(State.screen==='lobby') root().appendChild(renderLobby());
  else if(State.screen==='game') root().appendChild(renderGame());
}

function topBar(){
  const back = State.screen!=='menu' ? el('button',{class:'iconbtn', 'aria-label':'رجوع للقائمة الرئيسية', onclick:()=>{ leaveToMenu(); }},['←']) : el('span',{style:'width:40px'});
  return el('div',{class:'topbar'},[
    el('div',{class:'brand'},[el('span',{class:'dot','aria-hidden':'true'}),'أونو']),
    el('div',{class:'iconbtns'},[
      back,
      el('button',{class:'iconbtn', 'aria-pressed':String(State.soundOn), 'aria-label':'مؤثرات صوتية', onclick:()=>{ State.soundOn=!State.soundOn; SFX.click(); draw(); }},[State.soundOn?'🔊':'🔇']),
      el('button',{class:'iconbtn', 'aria-pressed':String(State.narrateOn), 'aria-label':'السرد الصوتي لمن يحتاجه', onclick:()=>{ State.narrateOn=!State.narrateOn; announce(State.narrateOn?'تم تفعيل السرد الصوتي':'تم إيقاف السرد الصوتي', {force:true}); draw(); }},['🗣️']),
    ])
  ]);
}

function renderMenu(){
  const wrap = el('div',{class:'menu'});
  wrap.appendChild(el('div',{class:'hero'},[
    (()=>{ const fan = el('div',{class:'card-fan','aria-hidden':'true'});
      [['-18deg',SYMBOLS.skip,'c-red'],['-6deg','7','c-yellow'],['6deg',SYMBOLS.reverse,'c-green'],['18deg','+4','c-blue']]
      .forEach(([r,label,cls])=> fan.appendChild(el('div',{class:'mini-card '+cls, style:`--r:${r}`},[label])));
      return fan; })(),
    el('h1',{},['أونو']),
    el('p',{},['العب مع أصدقائك أو ضد لاعبين افتراضيين — بمؤثرات صوتية ودعم لقارئ الشاشة'])
  ]));

  // name field
  const nameInput = el('input',{class:'text', type:'text', value:State.playerName, maxlength:'16',
    'aria-label':'اسمك', oninput:(e)=>{ State.playerName = e.target.value.trim()||'أنت'; }});
  wrap.appendChild(el('div',{class:'panel'},[
    el('label',{class:'field', for:'nm'},['اسمك في اللعبة']),
    nameInput
  ]));

  // vs AI panel
  const aiPanel = el('div',{class:'panel'});
  aiPanel.appendChild(el('h2',{},['🤖 العب ضد لاعبين افتراضيين']));
  aiPanel.appendChild(el('p',{class:'sub'},['اختر عدد الخصوم الافتراضيين ثم ابدأ اللعب فورًا']));
  const grid = el('div',{class:'opp-grid', role:'radiogroup', 'aria-label':'عدد الخصوم الافتراضيين'});
  [1,2,3,4].forEach(count=>{
    const label = count===1? 'خصم واحد' : count+' خصوم';
    grid.appendChild(el('button',{class:'opp-opt', role:'radio', 'aria-checked':String(State.aiCount===count), 'aria-pressed':String(State.aiCount===count),
      onclick:()=>{ State.aiCount=count; SFX.click(); draw(); }},[label, el('div',{style:'font-size:11px;font-weight:600;opacity:.8;margin-top:2px'},[`(${count+1} لاعبين إجمالًا)`])]));
  });
  aiPanel.appendChild(grid);
  aiPanel.appendChild(el('button',{class:'btn btn-primary', onclick:startAIGame},['ابدأ اللعب ▶']));
  wrap.appendChild(aiPanel);

  wrap.appendChild(el('div',{class:'divider'},['أو العب مع أصدقاء']));

  // room panel
  const roomPanel = el('div',{class:'panel'});
  roomPanel.appendChild(el('h2',{},['👥 غرفة خاصة']));
  roomPanel.appendChild(el('p',{class:'sub'},['أنشئ غرفة وشارك الرمز مع أصدقائك، أو انضم برمز غرفة موجودة (٢-٤ لاعبين)']));
  roomPanel.appendChild(el('button',{class:'btn btn-outline', onclick:async ()=>{
    SFX.click();
    const code = await createRoom(State.playerName||'أنت');
    State.mode='room'; State.screen='lobby'; startPolling(); draw();
  }},['أنشئ غرفتك 🎉']));

  const joinRow = el('div',{class:'row', style:'margin-top:12px'});
  const codeInput = el('input',{class:'text', type:'text', maxlength:'5', placeholder:'رمز الغرفة', style:'text-align:center;letter-spacing:4px;text-transform:uppercase', 'aria-label':'رمز الغرفة'});
  const joinBtn = el('button',{class:'btn btn-ghost', onclick: async ()=>{
    const code = codeInput.value.trim().toUpperCase();
    if(!code) return;
    SFX.click();
    const res = await joinRoom(code, State.playerName||'أنت');
    if(!res.ok){
      announce(res.reason==='not_found'?'لم يتم العثور على الغرفة': res.reason==='started'?'اللعبة بدأت بالفعل':'الغرفة ممتلئة');
      alert(res.reason==='not_found'?'لم يتم العثور على هذه الغرفة':res.reason==='started'?'بدأت اللعبة في هذه الغرفة بالفعل':'الغرفة ممتلئة (٤ لاعبين كحد أقصى)');
      return;
    }
    State.mode='room'; State.screen='lobby'; startPolling(); draw();
  }},['انضم']);
  joinRow.appendChild(codeInput); joinRow.appendChild(joinBtn);
  roomPanel.appendChild(joinRow);
  wrap.appendChild(roomPanel);

  wrap.appendChild(el('p',{class:'footer-note'},['ملاحظة: لعب الغرفة يعمل بين من يفتحون نفس رابط هذه اللعبة، عبر مزامنة دورية كل ثانيتين.']));
  return wrap;
}

function startAIGame(){
  SFX.click();
  State.mode='ai';
  State.game = newLocalGame(State.aiCount, State.playerName||'أنت');
  State.screen='game';
  draw();
  announce(`بدأت اللعبة. أول بطاقة هي ${describeCard(topCard(State.game))}`);
  maybeRunAITurn();
}

function leaveToMenu(){
  stopPolling();
  State.screen='menu'; State.game=null; State.room=null;
  draw();
}

/* ---------- lobby ---------- */
function startPolling(){
  stopPolling();
  State.roomPoll = setInterval(pollRoom, 1500);
  pollRoom();
}
function stopPolling(){ if(State.roomPoll){ clearInterval(State.roomPoll); State.roomPoll=null; } }
async function pollRoom(){
  if(!State.room) return;
  const room = await roomGet(State.room.code);
  if(!room) return;
  State._roomCache = room;
  if(room.started && room.state){
    if(State.screen!=='game'){ State.screen='game'; }
    const prevWinner = State.game && State.game.winner;
    State.game = room.state;
    draw();
  } else if(State.screen==='lobby'){
    draw();
  } else if(State.screen==='game' && !room.started){
    // still show lobby-ish
  }
}

function renderLobby(){
  const room = State._roomCache || {players:[{id:State.room.myId, name:State.playerName}], hostId:State.room.myId};
  const wrap = el('div',{class:'menu'});
  wrap.appendChild(el('div',{class:'panel'},[
    el('h2',{},['رمز الغرفة']),
    el('p',{class:'sub'},['شارك هذا الرمز مع أصدقائك ليدخلوا من نفس الشاشة']),
    el('div',{class:'lobby-code'},[State.room.code]),
  ]));
  const listPanel = el('div',{class:'panel'});
  listPanel.appendChild(el('h2',{},[`اللاعبون (${room.players.length}/4)`]));
  const ul = el('ul',{class:'players-list'});
  room.players.forEach(p=>{
    ul.appendChild(el('li',{},[
      el('span',{class:'avatar','aria-hidden':'true'},['🧑']),
      p.name,
      el('span',{class:'badge'},[p.id===room.hostId?'المضيف':''])
    ]));
  });
  listPanel.appendChild(ul);
  if(State.room.isHost){
    const canStart = room.players.length>=2;
    listPanel.appendChild(el('button',{class:'btn btn-primary', disabled: canStart?undefined:true,
      onclick: async ()=>{
        SFX.click();
        const gs = initGameStateForRoom(room.players);
        room.started = true; room.state = gs;
        await roomSet(State.room.code, room);
      }},[canStart? 'ابدأ اللعبة 🚀' : 'بانتظار لاعب آخر...']));
  } else {
    listPanel.appendChild(el('p',{class:'sub', style:'text-align:center;margin-top:10px'},['بانتظار المضيف لبدء اللعبة...']));
  }
  wrap.appendChild(listPanel);
  wrap.appendChild(el('button',{class:'btn btn-ghost', onclick:leaveToMenu},['مغادرة الغرفة']));
  return wrap;
}

/* ---------- game screen (shared render for AI + room) ---------- */
let pendingWild = null; // {card}

function myPlayerIndex(g){
  if(State.mode==='room') return g.players.findIndex(p=>p.id===State.room.myId);
  return 0;
}
function isMyTurn(g){ return g.currentIndex === myPlayerIndex(g); }

function renderGame(){
  const g = State.game;
  const wrap = el('div',{class:'table-wrap'});
  if(!g){ return wrap; }
  const felt = el('div',{class:'table-felt'});

  const myIdx = myPlayerIndex(g);
  const others = g.players.map((p,i)=>({p,i})).filter(o=>o.i!==myIdx);

  const oppRow = el('div',{class:'opponents'});
  others.forEach(({p,i})=>{
    const active = g.currentIndex===i && !g.winner;
    const backs = el('div',{class:'count','aria-hidden':'true'});
    for(let k=0;k<Math.min(p.hand.length,7);k++) backs.appendChild(el('div',{class:'backcard'}));
    oppRow.appendChild(el('div',{class:'opp'+(active?' active':'')},[
      el('div',{class:'name'},[p.name + (p.isAI?' 🤖':'')]),
      backs,
      el('div',{class:'status'},[`${p.hand.length} بطاقة` + (p.hand.length===1?' — أونو!':'') + (active?' • دورهم الآن':'')]),
    ]));
  });
  felt.appendChild(oppRow);

  felt.appendChild(el('div',{class:'turn-banner'},[
    g.winner ? `🎉 فاز ${g.winner.name}!` : (isMyTurn(g)? 'دورك — اختر بطاقة أو اسحب' : `دور ${g.players[g.currentIndex].name}...`)
  ]));

  const center = el('div',{class:'center-area'});
  const canDraw = isMyTurn(g) && !g.winner;
  center.appendChild(el('div',{class:'pile'},[
    el('div',{class:'pile-label'},['اسحب']),
    el('button',{class:'draw-pile', disabled: canDraw?undefined:true, 'aria-label':'اسحب بطاقة من الكومة', onclick:onDrawClick},[`🂠 ${g.deck?g.deck.length:0}`])
  ]));
  center.appendChild(el('div',{class:'pile'},[
    el('div',{class:'pile-label'},['البطاقة الحالية']),
    el('div',{class:'discard-slot'},[renderCard(topCard(g), {chosenColor:g.chosenColor})])
  ]));
  felt.appendChild(center);

  // hand
  const me = g.players[myIdx];
  const handWrap = el('div',{class:'hand-wrap'});
  handWrap.appendChild(el('div',{class:'hand-info'},[
    `بطاقاتك: ${me?me.hand.length:0}`, me&&me.hand.length===1? ' 🔔 أونو!':''
  ]));
  const handEl = el('div',{class:'hand', role:'group', 'aria-label':'بطاقاتك'});
  if(me){
    me.hand.forEach(card=>{
      const playable = isMyTurn(g) && !g.winner && canPlay(g,card);
      handEl.appendChild(renderCard(card, {
        onClick: ()=>onCardClick(card),
        disabled: !playable,
        aria: describeCard(card) + (playable? ' — قابلة للعب' : '')
      }));
    });
  }
  handWrap.appendChild(handEl);
  felt.appendChild(handWrap);

  wrap.appendChild(felt);
  return wrap;
}

function onCardClick(card){
  const g = State.game;
  if(!isMyTurn(g) || g.winner) return;
  if(!canPlay(g,card)){ SFX.invalid(); announce('هذه البطاقة لا يمكن لعبها الآن'); return; }
  if(card.type==='wild'||card.type==='wild4'){
    pendingWild = card;
    showColorPicker();
    return;
  }
  commitPlay(card, null);
}

function showColorPicker(){
  const overlay = el('div',{class:'overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'اختر لونًا'});
  const modal = el('div',{class:'modal'});
  modal.appendChild(el('h3',{},['اختر لونًا']));
  const grid = el('div',{class:'color-grid'});
  COLORS.forEach(c=>{
    grid.appendChild(el('button',{class:'color-btn c-'+c, onclick:()=>{
      document.body.removeChild(overlay);
      commitPlay(pendingWild, c);
      pendingWild=null;
    }},[COLOR_NAMES[c]]));
  });
  modal.appendChild(grid);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function commitPlay(card, chosenColor){
  const g = State.game;
  const myIdx = myPlayerIndex(g);
  SFX.play();
  const wasLastCard = g.players[myIdx].hand.length===1;
  applyPlay(g, myIdx, card, chosenColor);
  const txt = describeCard(card);
  if(g.winner){
    SFX.win();
    announce(`لعبت ${txt}. لقد فزت! 🎉`, {force:true});
  } else {
    if(g.players[myIdx].hand.length===1){ SFX.uno(); announce(`لعبت ${txt}. أونو! بقيت بطاقة واحدة`, {force:true}); }
    else announce(`لعبت ${txt}`);
  }
  afterMove();
}

function onDrawClick(){
  const g = State.game;
  const myIdx = myPlayerIndex(g);
  if(!isMyTurn(g) || g.winner) return;
  SFX.draw();
  const drawn = drawFromDeck(g,1);
  g.players[myIdx].hand.push(...drawn);
  announce('سحبت بطاقة');
  g.currentIndex = nextIndex(g, myIdx, 1);
  afterMove();
}

async function afterMove(){
  if(State.mode==='room'){
    const room = State._roomCache || await roomGet(State.room.code);
    room.state = State.game;
    room.started = true;
    await roomSet(State.room.code, room);
    draw();
  } else {
    draw();
    maybeRunAITurn();
  }
}

function maybeRunAITurn(){
  const g = State.game;
  if(!g || g.winner) return;
  const p = g.players[g.currentIndex];
  if(!p || !p.isAI) return;
  setTimeout(()=>{
    const idx = g.currentIndex;
    const choice = aiChoosePlay(g, idx);
    if(choice){
      SFX.play();
      applyPlay(g, idx, choice.card, choice.color);
      if(g.winner){ SFX.win(); announce(`${p.name} لعب ${describeCard(choice.card)} وفاز باللعبة`, {force:true}); }
      else {
        const nowLast = p.hand.length===1;
        if(nowLast){ SFX.uno(); }
        announce(`${p.name} لعب ${describeCard(choice.card)}` + (nowLast? ' وقال أونو!':''));
      }
    } else {
      SFX.draw();
      const drawn = drawFromDeck(g,1);
      p.hand.push(...drawn);
      let played = false;
      if(drawn[0] && canPlay(g, drawn[0])){
        let color = null;
        if(drawn[0].type==='wild'||drawn[0].type==='wild4'){
          const counts = {red:0,yellow:0,green:0,blue:0};
          p.hand.forEach(c=>{ if(c.color) counts[c.color]++; });
          color = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
        }
        SFX.play();
        applyPlay(g, idx, drawn[0], color);
        played = true;
      } else {
        g.currentIndex = nextIndex(g, idx, 1);
      }
      if(g.winner){ SFX.win(); announce(`${p.name} فاز باللعبة`, {force:true}); }
      else announce(`${p.name} سحب بطاقة` + (played? ' ولعبها':' ومرر الدور'));
    }
    draw();
    maybeRunAITurn();
  }, 900);
}

/* ---------- boot ---------- */
draw();
</script>
